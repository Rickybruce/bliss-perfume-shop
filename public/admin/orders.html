<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orders — Admin — Bliss Perfumes</title>
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>

  <header class="admin-header">
    <div class="brand-wrap">
      <a class="brand" href="index.html">Bliss Perfumes</a>
      <span class="admin-badge">Admin</span>
    </div>
    <nav class="admin-nav">
      <a href="index.html">Dashboard</a>
      <a href="products.html">Products</a>
      <a href="orders.html" class="active">Orders</a>
      <a href="pickup.html">Pickup</a>
      <a href="/index.html" target="_blank">View Shop ↗</a>
      <div class="admin-user">
        <span id="admin-username">Admin</span>
        <button type="button" class="btn-logout" id="logout-btn">Log out</button>
      </div>
    </nav>
  </header>

  <main class="admin-container">
    <div class="page-title-row">
      <div>
        <h1>Orders Management</h1>
        <p style="color: var(--muted); margin: 4px 0 0;">Customer orders and fulfilment tracking.</p>
      </div>
      <button type="button" class="btn btn-secondary" id="refresh-orders">Refresh</button>
    </div>

    <div class="page-title-row">
      <label for="status-filter">Filter by status</label>
      <select id="status-filter" aria-label="Filter orders by status">
        <option value="all">All orders</option>
        <option value="pending">Pending</option>
        <option value="paid">Paid</option>
        <option value="packed">Packed</option>
        <option value="ready">Ready</option>
        <option value="shipped">Shipped</option>
        <option value="collected">Collected</option>
        <option value="cancelled">Cancelled</option>
      </select>
    </div>

    <p class="status-msg" id="orders-status" role="status" aria-live="polite"></p>
    <div class="table-wrap">
      <table class="orders-table">
        <thead>
          <tr><th>Order</th><th>Customer</th><th>Fulfilment</th><th>Placed</th><th>Total</th><th>Status</th><th></th></tr>
        </thead>
        <tbody id="orders-body"></tbody>
      </table>
    </div>
  </main>

  <script src="js/admin-common.js"></script>
  <script src="js/admin-orders.js"></script>
</body>
</html>
