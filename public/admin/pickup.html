<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Pickup verification — Admin — Bliss Perfumes</title>
	<link rel="stylesheet" href="css/admin.css">
</head>
<body>
	<header class="admin-header">
		<div class="brand-wrap"><a class="brand" href="index.html">Bliss Perfumes</a><span class="admin-badge">Admin</span></div>
		<nav class="admin-nav">
			<a href="index.html">Dashboard</a><a href="products.html">Products</a><a href="orders.html">Orders</a><a href="pickup.html" class="active">Pickup</a><a href="/index.html" target="_blank">View Shop ↗</a>
			<div class="admin-user"><span id="admin-username">Admin</span><button type="button" class="btn-logout" id="logout-btn">Log out</button></div>
		</nav>
	</header>
	<main class="admin-container">
		<div class="page-title-row"><div><h1>Campus pickup</h1><p style="color: var(--muted); margin: 4px 0 0;">Verify the code shown by the customer when collecting a ready order.</p></div></div>
		<section class="form-card" aria-labelledby="verify-heading">
			<h2 id="verify-heading">Verify pickup code</h2>
			<form id="pickup-form" novalidate>
				<div class="form-grid">
					<div class="form-group"><label for="pickup-order-id">Order number</label><input id="pickup-order-id" name="orderId" type="number" min="1" step="1" required inputmode="numeric"></div>
					<div class="form-group"><label for="pickup-code">Six-digit code</label><input id="pickup-code" name="code" type="text" pattern="[0-9]{6}" minlength="6" maxlength="6" required inputmode="numeric" autocomplete="one-time-code"></div>
				</div>
				<p class="status-msg" id="pickup-status" role="status" aria-live="polite"></p>
				<button class="btn" id="verify-pickup" type="submit">Verify and mark collected</button>
			</form>
		</section>
	</main>
	<script src="js/admin-common.js"></script>
	<script src="js/admin-pickup.js"></script>
</body>
</html>
