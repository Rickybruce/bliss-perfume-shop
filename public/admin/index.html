<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard — Admin — Bliss Perfumes</title>
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>

  <header class="admin-header">
    <div class="brand-wrap">
      <a class="brand" href="index.html">Bliss Perfumes</a>
      <span class="admin-badge">Admin</span>
    </div>
    <nav class="admin-nav">
      <a href="index.html" class="active">Dashboard</a>
      <a href="products.html">Products</a>
      <a href="orders.html">Orders</a>
      <a href="/index.html" target="_blank">View Shop ↗</a>
      <div class="admin-user">
        <span id="admin-username">Admin</span>
        <button type="button" class="btn-logout" id="logout-btn">Log out</button>
      </div>
    </nav>
  </header>

  <main class="admin-container">
    <div class="page-title-row">
      <div>
        <h1>Admin Dashboard</h1>
        <p style="color: var(--muted); margin: 4px 0 0;">Welcome to Bliss Perfumes management portal.</p>
      </div>
      <div>
        <a href="product-form.html" class="btn">+ Add Product</a>
      </div>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <h3>Total Products</h3>
        <p class="stat-value" id="stat-products">—</p>
      </div>
      <div class="stat-card">
        <h3>Published Listings</h3>
        <p class="stat-value" id="stat-published">—</p>
      </div>
      <div class="stat-card">
        <h3>Total Bottles in Stock</h3>
        <p class="stat-value" id="stat-stock">—</p>
      </div>
    </div>

    <div style="display: flex; gap: 16px; flex-wrap: wrap;">
      <a href="products.html" class="btn btn-secondary">Manage Products Table →</a>
      <a href="/index.html" target="_blank" class="btn btn-secondary">Open Customer Storefront ↗</a>
    </div>
  </main>

  <script src="js/admin-common.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const res = await fetch('/api/admin/products', { credentials: 'same-origin' });
        if (res.ok) {
          const { products } = await res.json();
          document.getElementById('stat-products').textContent = products.length;
          const published = products.filter(p => p.is_published).length;
          document.getElementById('stat-published').textContent = published;
          const totalStock = products.reduce((acc, p) => acc + (Number(p.total_stock) || 0), 0);
          document.getElementById('stat-stock').textContent = totalStock;
        }
      } catch (_) {}
    });
  </script>
</body>
</html>
