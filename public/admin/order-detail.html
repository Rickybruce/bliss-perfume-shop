<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Order detail — Admin — Bliss Perfumes</title>
	<link rel="stylesheet" href="css/admin.css">
</head>
<body>
	<header class="admin-header">
		<div class="brand-wrap"><a class="brand" href="index.html">Bliss Perfumes</a><span class="admin-badge">Admin</span></div>
		<nav class="admin-nav">
			<a href="index.html">Dashboard</a><a href="products.html">Products</a><a href="orders.html" class="active">Orders</a><a href="pickup.html">Pickup</a>
			<div class="admin-user"><span id="admin-username">Admin</span><button type="button" class="btn-logout" id="logout-btn">Log out</button></div>
		</nav>
	</header>
	<main class="admin-container">
		<div class="page-title-row">
			<div><p><a href="orders.html">← All orders</a></p><h1 id="order-heading">Order detail</h1></div>
		</div>
		<p class="status-msg" id="detail-status" role="status" aria-live="polite"></p>
		<section class="form-card" aria-labelledby="customer-heading">
			<h2 id="customer-heading">Customer and fulfilment</h2>
			<div class="form-grid">
				<p><strong>Customer</strong><br><span id="customer-name">—</span></p>
				<p><strong>Phone</strong><br><span id="customer-phone">—</span></p>
				<p><strong>Fulfilment</strong><br><span id="fulfillment-type">—</span></p>
				<p><strong>Destination</strong><br><span id="fulfillment-destination">—</span></p>
				<p><strong>Placed</strong><br><span id="created-at">—</span></p>
				<p><strong>Order total</strong><br><span id="order-total">—</span></p>
			</div>
		</section>
		<section class="form-card" style="margin-top: 20px;" aria-labelledby="items-heading">
			<h2 id="items-heading">Items</h2>
			<div class="table-wrap">
				<table><thead><tr><th>Product</th><th>Size</th><th>Qty</th><th>Unit price</th><th>Line total</th></tr></thead><tbody id="order-items"></tbody></table>
			</div>
			<p><strong>Fulfilment fee:</strong> <span id="delivery-fee">—</span></p>
		</section>
		<section class="form-card" style="margin-top: 20px;" aria-labelledby="status-heading">
			<h2 id="status-heading">Update order status</h2>
			<div class="form-grid">
				<div class="form-group"><label for="order-status">Status</label><select id="order-status">
					<option value="pending">Pending</option><option value="paid">Paid</option><option value="packed">Packed</option><option value="ready">Ready</option><option value="shipped">Shipped</option><option value="collected">Collected</option><option value="cancelled">Cancelled</option>
				</select></div>
				<div class="form-group"><span aria-hidden="true">&nbsp;</span><button type="button" class="btn" id="save-status">Save status</button></div>
			</div>
		</section>
	</main>
	<script src="js/admin-common.js"></script>
	<script src="js/admin-order-detail.js"></script>
</body>
</html>
