<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Products — Admin — Bliss Perfumes</title>
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>

  <header class="admin-header">
    <div class="brand-wrap">
      <a class="brand" href="index.html">Bliss Perfumes</a>
      <span class="admin-badge">Admin</span>
    </div>
    <nav class="admin-nav">
      <a href="index.html">Dashboard</a>
      <a href="products.html" class="active">Products</a>
      <a href="orders.html">Orders</a>
      <a href="/index.html" target="_blank">View Shop ↗</a>
      <div class="admin-user">
        <span id="admin-username">Admin</span>
        <button type="button" class="btn-logout" id="logout-btn">Log out</button>
      </div>
    </nav>
  </header>

  <main class="admin-container">
    <div class="page-title-row">
      <div>
        <h1>Products</h1>
        <p style="color: var(--muted); margin: 4px 0 0;">Manage your catalog, stock, and listings.</p>
      </div>
      <a href="product-form.html" class="btn">+ Add Product</a>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th style="width: 60px;">Image</th>
            <th>Product</th>
            <th>Brand</th>
            <th>Concentration</th>
            <th>Scent Family</th>
            <th>Variants</th>
            <th>Total Stock</th>
            <th>Min Price</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="products-table-body">
          <tr>
            <td colspan="10" style="text-align: center; color: var(--muted); padding: 40px;">
              Loading products...
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>

  <script src="js/admin-common.js"></script>
  <script src="js/admin-products.js"></script>
</body>
</html>
