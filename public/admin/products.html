<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Products — Admin — Bliss Perfumes</title>
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>

  <header class="admin-header">
    <div class="brand-wrap">
      <a class="brand" href="index.html">Bliss Perfumes</a>
      <span class="admin-badge">Admin</span>
    </div>
    <nav class="admin-nav">
      <a href="index.html">Dashboard</a>
      <a href="products.html" class="active">Products</a>
      <a href="orders.html">Orders</a>
      <a href="pickup.html">Pickup</a>
      <a href="/index.html" target="_blank">View Shop ↗</a>
      <div class="admin-user">
        <span id="admin-username">Admin</span>
        <button type="button" class="btn-logout" id="logout-btn">Log out</button>
      </div>
    </nav>
  </header>

  <main class="admin-container">
    <div class="page-title-row">
      <div>
        <h1>Products</h1>
        <p style="color: var(--muted); margin: 4px 0 0;">Everything in your shop, including drafts. Hidden products are not visible to customers.</p>
      </div>
      <a href="product-form.html" class="btn">+ Add Product</a>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th></th><th>Name</th><th>Brand</th><th>Type</th><th>Scent</th>
            <th>Sizes</th><th>Bottles</th><th>From</th><th>Status</th><th>Actions</th>
          </tr>
        </thead>
        <tbody id="products-table-body">
          <tr><td colspan="10" style="text-align:center;color:var(--muted);padding:40px;">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <script src="js/admin-common.js"></script>
  <script src="js/admin-products.js"></script>
</body>
</html>
