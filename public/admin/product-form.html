<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Add Product — Admin — Bliss Perfumes</title>
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>

  <header class="admin-header">
    <div class="brand-wrap">
      <a class="brand" href="index.html">Bliss Perfumes</a>
      <span class="admin-badge">Admin</span>
    </div>
    <nav class="admin-nav">
      <a href="index.html">Dashboard</a>
      <a href="products.html" class="active">Products</a>
      <a href="orders.html">Orders</a>
      <a href="/index.html" target="_blank">View Shop ↗</a>
      <div class="admin-user">
        <span id="admin-username">Admin</span>
        <button type="button" class="btn-logout" id="logout-btn">Log out</button>
      </div>
    </nav>
  </header>

  <main class="admin-container">
    <div class="page-title-row">
      <div>
        <a href="products.html" style="color: var(--muted); font-size: 0.85rem; text-decoration: none;">← Back to Products</a>
        <h1 style="margin-top: 6px;">Add New Product</h1>
      </div>
    </div>

    <div class="form-card">
      <form id="product-form" novalidate>
        <div class="form-grid">

          <!-- General Details -->
          <div class="section-divider">General Details</div>

          <div class="form-group">
            <label for="name">Product Name <span class="req">*</span></label>
            <input type="text" id="name" name="name" placeholder="e.g. Angham" required>
          </div>

          <div class="form-group">
            <label for="brand">Brand</label>
            <input type="text" id="brand" name="brand" placeholder="e.g. Lattafa">
          </div>

          <div class="form-group">
            <label for="concentration">Concentration</label>
            <select id="concentration" name="concentration">
              <option value="EDP" selected>EDP (Eau de Parfum)</option>
              <option value="EDT">EDT (Eau de Toilette)</option>
              <option value="Extrait">Extrait de Parfum</option>
              <option value="Parfum">Parfum</option>
            </select>
          </div>

          <div class="form-group">
            <label for="scent_family">Scent Family</label>
            <input type="text" id="scent_family" name="scent_family" placeholder="e.g. oriental, floral, woody, fresh">
          </div>

          <div class="form-group full">
            <label for="description">Description</label>
            <textarea id="description" name="description" placeholder="Short description of the perfume..."></textarea>
          </div>

          <!-- Scent Notes -->
          <div class="section-divider">Scent Notes</div>

          <div class="form-group full">
            <label for="top_notes">Top Notes</label>
            <input type="text" id="top_notes" name="top_notes" placeholder="e.g. Ginger, Mandarin, Pink Pepper">
          </div>

          <div class="form-group full">
            <label for="middle_notes">Middle (Heart) Notes</label>
            <input type="text" id="middle_notes" name="middle_notes" placeholder="e.g. Praline, Cacao, Lavender, Jasmine">
          </div>

          <div class="form-group full">
            <label for="base_notes">Base Notes</label>
            <input type="text" id="base_notes" name="base_notes" placeholder="e.g. Vanilla, Amber, Musk">
          </div>

          <!-- Initial Variant -->
          <div class="section-divider">Bottle Size & Pricing (Primary Variant)</div>

          <div class="form-group">
            <label for="size_ml">Bottle Size (ml) <span class="req">*</span></label>
            <input type="number" id="size_ml" name="size_ml" value="100" min="1" required>
          </div>

          <div class="form-group">
            <label for="price_ghs">Price (in GHS) <span class="req">*</span></label>
            <input type="number" id="price_ghs" name="price_ghs" step="0.01" min="0.01" placeholder="e.g. 350.00" required>
          </div>

          <div class="form-group">
            <label for="stock">Initial Stock <span class="req">*</span></label>
            <input type="number" id="stock" name="stock" value="10" min="0" required>
          </div>

          <div class="form-group">
            <label for="sku">SKU (optional)</label>
            <input type="text" id="sku" name="sku" placeholder="e.g. LAT-ANG-100">
          </div>

          <!-- Image -->
          <div class="section-divider">Media & Visibility</div>

          <div class="form-group full">
            <label for="image_url">Image URL or Local Path</label>
            <input type="text" id="image_url" name="image_url" placeholder="e.g. /images/Angham by Lattafa.webp or https://...">
            <span style="font-size: 0.8rem; color: var(--muted); margin-top: 4px;">
              Can be a local path in <code>public/images/</code> (like <code>/images/filename.webp</code>) or an external Cloudinary URL.
            </span>
          </div>

          <div class="form-group full" style="margin-top: 8px;">
            <label class="checkbox-label">
              <input type="checkbox" id="is_published" name="is_published" checked>
              <span>Publish immediately (visible to customers on the home page)</span>
            </label>
          </div>

          <div class="form-group full" style="margin-top: 14px;">
            <button type="submit" class="btn" id="submit-btn">Save Product</button>
            <div id="status-msg" class="status-msg" role="status"></div>
          </div>

        </div>
      </form>
    </div>
  </main>

  <script src="js/admin-common.js"></script>
  <script src="js/admin-product-form.js"></script>
</body>
</html>
