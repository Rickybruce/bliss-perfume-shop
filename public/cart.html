<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Your cart — Bliss Perfumes</title>
  <link rel="stylesheet" href="css/shop.css">
  <link rel="stylesheet" href="css/cart.css">
</head>
<body>

  <header class="site-header">
    <a class="brand" href="index.html">Bliss Perfumes</a>
    <nav>
      <span id="nav-account"><a href="login.html">Log in</a></span>
      <a class="cart-link" href="cart.html" aria-label="Cart">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/>
          <line x1="3" y1="6" x2="21" y2="6"/>
          <path d="M16 10a4 4 0 0 1-8 0"/>
        </svg>
        Cart (<span id="header-cart-count">0</span>)
      </a>
    </nav>
  </header>

  <main class="cart-main">
    <h1>Your cart</h1>

    <div id="empty-cart-view" hidden>
      <p class="cart-empty-text">Your cart is empty.</p>
      <a class="cart-btn" href="index.html">Browse perfumes</a>
    </div>

    <div id="cart-view" class="cart-layout" hidden>
      <div id="cart-items-container" class="cart-items"></div>

      <aside class="cart-summary" aria-labelledby="cart-summary-heading">
        <h2 id="cart-summary-heading">Summary</h2>
        <dl class="cart-totals">
          <div><dt>Subtotal</dt><dd id="cart-subtotal">GHS 0.00</dd></div>
          <div><dt>Delivery</dt><dd>Chosen at checkout</dd></div>
          <div class="cart-total-row"><dt>Total</dt><dd id="cart-total">GHS 0.00</dd></div>
        </dl>
        <a class="cart-btn cart-btn-block" href="checkout.html">Checkout</a>
        <a class="cart-continue" href="index.html">Continue shopping</a>
      </aside>
    </div>
  </main>

  <script src="js/cart.js"></script>
</body>
</html>
