<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Account — Bliss Perfumes</title>
  <link rel="stylesheet" href="css/account.css">
</head>
<body>

  <header class="site-header">
    <a class="brand" href="index.html">Shop name</a>
    <nav>
      <span id="nav-account"></span>
      <a class="cart-link" href="cart.html">Cart</a>
    </nav>
  </header>

  <main class="account-main">
    <h1>Your account</h1>
    <p class="lede">Details from the account you signed in with.</p>
    <p class="page-status" id="page-status" role="status" aria-live="polite">Loading...</p>

    <div id="account-content" hidden>
      <dl class="dl">
        <div class="dl-row">
          <dt>Username</dt>
          <dd id="account-username"></dd>
        </div>
        <div class="dl-row">
          <dt>Email</dt>
          <dd id="account-email"></dd>
        </div>
        <div class="dl-row">
          <dt>Phone</dt>
          <dd id="account-phone"></dd>
        </div>
      </dl>

      <div class="actions">
        <a class="btn" href="orders.html">Your orders</a>
        <button class="btn btn-ghost" type="button" id="logout-btn">Log out</button>
      </div>
    </div>
  </main>

  <script src="js/account.js"></script>
</body>
</html>
